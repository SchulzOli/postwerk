services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postwerk
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postwerk}
      POSTGRES_DB: postwerk
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postwerk"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      target: worker
    command: ["node", "dist/migrate.js"]
    environment:
      DATABASE_URL: postgres://postwerk:${POSTGRES_PASSWORD:-postwerk}@postgres:5432/postwerk
    depends_on:
      postgres:
        condition: service_healthy
    profiles: [app]

  web:
    build:
      context: .
      target: web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgres://postwerk:${POSTGRES_PASSWORD:-postwerk}@postgres:5432/postwerk
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      APP_URL: ${APP_URL:-http://localhost:3000}
      ENABLE_SANDBOX: ${ENABLE_SANDBOX:-false}
    depends_on:
      migrate:
        condition: service_completed_successfully
    profiles: [app]

  worker:
    build:
      context: .
      target: worker
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://postwerk:${POSTGRES_PASSWORD:-postwerk}@postgres:5432/postwerk
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    profiles: [app]

volumes:
  postgres-data:
