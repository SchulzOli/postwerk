name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postwerk
          POSTGRES_PASSWORD: postwerk
          POSTGRES_DB: postwerk_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postwerk"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postwerk:postwerk@localhost:5432/postwerk_test
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build worker image
        run: docker build --target worker -t postwerk-worker .
      - name: Build web image
        run: docker build --target web -t postwerk-web .
      - name: Start stack and smoke test
        env:
          ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
        run: |
          docker tag postwerk-worker postwerk-migrate
          docker compose --profile app up -d --no-build
          for i in $(seq 1 30); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/login) && [ "$STATUS" = "200" ] && break
            sleep 2
          done
          echo "HTTP status: $STATUS"
          [ "$STATUS" = "200" ]
          docker compose ps --format '{{.Service}} {{.State}}' | grep -q 'worker running'
      - name: Logs on failure
        if: failure()
        run: docker compose --profile app logs
